# Prüft jeden Pull Request, bevor etwas nach main kommt.
name: Prüfung

on:
  pull_request:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Siehe deploy.yml: der Installationsschritt von onnxruntime-node laedt
      # ~100 MB nach und ist hier nicht noetig.
      - name: Abhängigkeiten
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          npm ci || {
            echo "Netz zickt - zweiter Versuch in 20 Sekunden"
            sleep 20
            npm ci
          }
      - name: Weltdaten
        run: npm run pruefen
      - name: TypeScript
        run: npm run typecheck
      - name: Bauen
        run: npx next build
