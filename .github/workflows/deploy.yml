# Baut die Welt und veröffentlicht sie auf GitHub Pages.
#
# Einmalig im Repository einzustellen:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Danach genügt ein Push auf main.
name: Welt bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Weltdaten prüfen
        run: npm run pruefen

      # Zwei Adressen, ein Bau.
      #
      # Ohne eigene Domain liegt die Seite in einem Unterordner von github.io –
      # dann braucht sie einen Basispfad. Mit eigener Domain liegt sie in der
      # Wurzel, und der Basispfad muss weg, sonst zeigt jeder Link ins Leere.
      #
      # Umgestellt wird das an einer Stelle: Repository → Settings → Secrets and
      # variables → Actions → Variables → `SEITEN_DOMAIN`, z. B.
      # `www.trendonix-buecher.de`. Ist die Variable leer, bleibt alles wie bisher.
      # Ein Umlautname wird dort in Punycode eingetragen (siehe DOMAIN.md).
      - name: Bauen
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
          NEXT_EXPORT: '1'
        run: |
          if [ -n "$SEITEN_DOMAIN" ]; then
            # Die eigene Domain wird vom Auftrag „webspace“ beliefert. Hier
            # entsteht nur noch der Spiegel unter github.io – gleiche Seite,
            # aber mit Basispfad und für Suchmaschinen gesperrt, damit nicht
            # zwei Adressen denselben Text anbieten.
            export NEXT_PUBLIC_SPIEGEL="1"
          fi
          export NEXT_PUBLIC_BASIS_PFAD="/Buch-landingpage-"
          export NEXT_PUBLIC_BASIS_URL="https://manuelbrandner85.github.io/Buch-landingpage-"
          npx next build

      # Ein statischer Export hat keinen Server, der einen falschen Pfad noch
      # abfängt. Deshalb wird jeder interne Verweis nachgeschlagen, bevor
      # irgendetwas veröffentlicht wird.
      - name: Wege prüfen
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: |
          export NEXT_PUBLIC_BASIS_PFAD="/Buch-landingpage-"
          node scripts/pruefe-wege.mjs

      - name: Jekyll abschalten
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # ── Die eigene Domain ───────────────────────────────────────────────────
  #
  # www.trendonix-buecher.de liegt nicht auf GitHub Pages, sondern auf dem
  # Webspace des Anbieters – dort liegt auch das Postfach. Deshalb wird die
  # gebaute Seite dorthin hochgeladen, statt die Domain umzuhängen: Am
  # Mailversand ändert sich nichts, und ein Push auf main erneuert die Seite.
  #
  # EINZURICHTEN IST GENAU EINE SACHE.
  #
  #   Repository → Settings → Secrets and variables → Actions → New repository
  #   secret. Name: FTP_ZUGANG. Wert in dieser Form:
  #
  #       benutzer:kennwort@server
  #
  #   also zum Beispiel   f018ae3e:MEINKENNWORT@w021fb9a.kasserver.com
  #
  #   Liegt die Seite nicht im Wurzelverzeichnis des FTP-Zugangs, kommt das
  #   Verzeichnis hinten dran:  …@server/unterordner
  #
  # Server und Benutzer stehen absichtlich mit im Secret und nicht offen im
  # Repository: Es ist öffentlich, und eine dort veröffentlichte FTP-Kennung
  # ist eine Einladung. Im Secret werden alle drei Teile in den Protokollen
  # maskiert.
  #
  # Ohne das Secret bricht nichts – der Auftrag steigt nach wenigen Sekunden
  # wieder aus, und die Seite bleibt auf github.io.
  webspace:
    runs-on: ubuntu-latest
    steps:
      - name: Zugang vorhanden?
        id: zugang
        env:
          FTP_ZUGANG: ${{ secrets.FTP_ZUGANG }}
        run: |
          if [ -n "$FTP_ZUGANG" ]; then
            echo "da=ja" >> "$GITHUB_OUTPUT"
          else
            echo "da=nein" >> "$GITHUB_OUTPUT"
            echo "::notice title=Webspace übersprungen::Kein Secret FTP_ZUGANG hinterlegt. Die Seite bleibt auf github.io."
          fi

      - uses: actions/checkout@v4
        if: steps.zugang.outputs.da == 'ja'

      - uses: actions/setup-node@v4
        if: steps.zugang.outputs.da == 'ja'
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        if: steps.zugang.outputs.da == 'ja'
        run: npm ci

      - name: Weltdaten prüfen
        if: steps.zugang.outputs.da == 'ja'
        run: npm run pruefen

      - name: Bauen
        if: steps.zugang.outputs.da == 'ja'
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASIS_PFAD: ''
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: |
          export NEXT_PUBLIC_BASIS_URL="https://${SEITEN_DOMAIN:-www.trendonix-buecher.de}"
          npx next build

      # Ohne Server, der einen falschen Pfad abfängt, muss jeder Verweis
      # stimmen, bevor irgendetwas hochgeladen wird.
      - name: Wege prüfen
        if: steps.zugang.outputs.da == 'ja'
        env:
          NEXT_PUBLIC_BASIS_PFAD: ''
        run: node scripts/pruefe-wege.mjs

      - name: Serverregeln beilegen
        if: steps.zugang.outputs.da == 'ja'
        run: node scripts/htaccess.mjs

      - name: Hochladen
        env:
          FTP_ZUGANG: ${{ secrets.FTP_ZUGANG }}
          FTP_ZIEL: ${{ vars.FTP_ZIEL }}
          FTP_LOESCHEN: ${{ vars.FTP_LOESCHEN }}
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: |
          set -eu +x
          DOMAIN="${SEITEN_DOMAIN:-www.trendonix-buecher.de}"

          # benutzer:kennwort@server[/verzeichnis] auseinandernehmen.
          # Der Benutzer steht vor dem ersten Doppelpunkt, der Server hinter
          # dem letzten Klammeraffen – so darf das Kennwort selbst einen
          # Klammeraffen enthalten, was bei Kennwörtern durchaus vorkommt.
          BENUTZER="${FTP_ZUGANG%%:*}"
          REST="${FTP_ZUGANG#*:}"
          HOST_TEIL="${REST##*@}"
          KENNWORT="${REST%@*}"
          case "$HOST_TEIL" in
            */*) SERVER="${HOST_TEIL%%/*}"; VORGABE="/${HOST_TEIL#*/}" ;;
            *)   SERVER="$HOST_TEIL";       VORGABE="" ;;
          esac
          if [ -z "$BENUTZER" ] || [ -z "$KENNWORT" ] || [ -z "$SERVER" ]; then
            echo "::error title=FTP_ZUGANG unlesbar::Erwartet wird benutzer:kennwort@server"
            exit 1
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp_tun() {
            lftp -c "
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 2;
              set net:timeout 20;
              set cmd:fail-exit true;
              open -u \"$BENUTZER\",\"$KENNWORT\" \"$SERVER\";
              $1
            "
          }

          # ── Wohin? ────────────────────────────────────────────────────────
          #
          # Zweimal lief der Upload fehlerfrei durch und war trotzdem
          # unsichtbar: Der FTP-Zugang landet woanders als der Dokumentenstamm
          # der Domain. Ein grüner Haken beim Hochladen sagt nur, dass die
          # Dateien angekommen sind – nicht, dass sie am richtigen Ort liegen.
          #
          # Deshalb wird das Ziel nicht geraten, sondern nachgewiesen: eine
          # winzige Datei mit einer Kennung hochladen und über die Domain
          # wieder abrufen. Wo sie auftaucht, ist der Dokumentenstamm.
          OHNE_WWW="${DOMAIN#www.}"
          if [ -n "$VORGABE" ]; then KANDIDATEN="$VORGABE"
          elif [ -n "${FTP_ZIEL:-}" ]; then KANDIDATEN="$FTP_ZIEL"
          else
            # Das Konto steckt im Servernamen: w021fb9a.kasserver.com → w021fb9a.
            KONTO="${SERVER%%.*}"
            # Zuerst das Anmeldeverzeichnis selbst: Bei diesem Anbieter ist
            # der FTP-Nutzer auf den Dokumentenstamm der Domain festgelegt,
            # von der Verbindung aus gesehen ist das schlicht die Wurzel.
            KANDIDATEN="/ /$OHNE_WWW /$DOMAIN /htdocs /htdocs/$OHNE_WWW"
            KANDIDATEN="$KANDIDATEN /$KONTO/$OHNE_WWW /www/htdocs/$KONTO/$OHNE_WWW"
          fi

          MARKE="probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$MARKE" > /tmp/_probe.txt
          ZIEL=""
          ERSTER_BESCHREIBBARER=""
          for K in $KANDIDATEN; do
            echo "Prüfe $K"
            if ! lftp_tun "put -O \"$K\" /tmp/_probe.txt -o _probe.txt;" 2>/dev/null; then
              echo "  nicht beschreibbar"
              continue
            fi
            [ -n "$ERSTER_BESCHREIBBARER" ] || ERSTER_BESCHREIBBARER="$K"
            sleep 2
            if curl -fsS --max-time 25 "https://$DOMAIN/_probe.txt" 2>/dev/null | grep -qx "$MARKE"; then
              ZIEL="$K"
              echo "  das ist der Dokumentenstamm"
              break
            fi
            echo "  beschreibbar, aber nicht unter der Domain sichtbar"
          done

          # Die Sonde darf nicht das letzte Wort haben.
          #
          # Eine fehlerhafte .htaccess im Dokumentenstamm beantwortet jede
          # Anfrage mit 500 – auch die nach der Sonde. Dann bestätigt kein
          # Kandidat, und ausgerechnet die Veröffentlichung, die den Fehler
          # behebt, käme nie durch. Eine Sackgasse, aus der man sich nicht
          # herausveröffentlichen kann.
          #
          # Deshalb ist die Sonde ein Nachweis, keine Sperre: Bestätigt keiner,
          # wird der erste beschreibbare Kandidat genommen und laut gewarnt.
          # Das letzte Wort hat die Abfrage der fertigen Seite weiter unten.
          if [ -z "$ZIEL" ]; then
            if [ -n "$ERSTER_BESCHREIBBARER" ]; then
              ZIEL="$ERSTER_BESCHREIBBARER"
              echo "::warning title=Ziel nicht bestätigt::Kein Kandidat war über https://$DOMAIN erreichbar – vermutlich antwortet der Server gerade mit einem Fehler. Es wird nach $ZIEL geladen und danach geprüft."
            else
              echo "::error title=Kein beschreibbares Verzeichnis::Versucht wurde: $KANDIDATEN"
              exit 1
            fi
          fi
          echo "Ziel: $SERVER$ZIEL"

          # Gelöscht wird nur auf ausdrückliche Ansage. Wer im Zielverzeichnis
          # noch etwas anderes liegen hat, verlöre es sonst mit dem ersten Mal.
          if [ "${FTP_LOESCHEN:-}" = "ja" ]; then LOESCHEN="--delete"; else LOESCHEN=""; fi
          lftp_tun "mirror -R --parallel=4 --no-perms --ignore-time $LOESCHEN out/ \"$ZIEL\";"
          echo "Hochgeladen nach $ZIEL"

      # Der eigentliche Beweis. Alles davor kann grün sein, ohne dass jemand
      # die Seite sehen kann.
      - name: Steht die Seite?
        if: steps.zugang.outputs.da == 'ja'
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: |
          DOMAIN="${SEITEN_DOMAIN:-www.trendonix-buecher.de}"
          sleep 5
          FEHLER=0
          for W in "/" "/robots.txt" "/faeden/" "/buch/band-1/"; do
            if curl -fsS --max-time 30 "https://$DOMAIN$W" | grep -q "Trendonix\|User-Agent"; then
              echo "  ok   $W"
            else
              echo "  FEHLT $W"; FEHLER=1
            fi
          done
          if [ "$FEHLER" = "1" ]; then
            echo "::error title=Seite nicht erreichbar::Der Upload lief durch, aber https://$DOMAIN liefert nicht die neue Seite."
            exit 1
          fi
          echo "https://$DOMAIN steht."
