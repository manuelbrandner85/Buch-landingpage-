# Baut die Welt und veröffentlicht sie auf GitHub Pages.
#
# Einmalig im Repository einzustellen:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Danach genügt ein Push auf main.
name: Welt bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Weltdaten prüfen
        run: npm run pruefen

      # Zwei Adressen, ein Bau.
      #
      # Ohne eigene Domain liegt die Seite in einem Unterordner von github.io –
      # dann braucht sie einen Basispfad. Mit eigener Domain liegt sie in der
      # Wurzel, und der Basispfad muss weg, sonst zeigt jeder Link ins Leere.
      #
      # Umgestellt wird das an einer Stelle: Repository → Settings → Secrets and
      # variables → Actions → Variables → `SEITEN_DOMAIN`, z. B.
      # `www.trendonix-buecher.de`. Ist die Variable leer, bleibt alles wie bisher.
      # Ein Umlautname wird dort in Punycode eingetragen (siehe DOMAIN.md).
      - name: Bauen
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
          NEXT_EXPORT: '1'
        run: |
          if [ -n "$SEITEN_DOMAIN" ]; then
            # Die eigene Domain wird vom Auftrag „webspace“ beliefert. Hier
            # entsteht nur noch der Spiegel unter github.io – gleiche Seite,
            # aber mit Basispfad und für Suchmaschinen gesperrt, damit nicht
            # zwei Adressen denselben Text anbieten.
            export NEXT_PUBLIC_SPIEGEL="1"
          fi
          export NEXT_PUBLIC_BASIS_PFAD="/Buch-landingpage-"
          export NEXT_PUBLIC_BASIS_URL="https://manuelbrandner85.github.io/Buch-landingpage-"
          npx next build

      # Ein statischer Export hat keinen Server, der einen falschen Pfad noch
      # abfängt. Deshalb wird jeder interne Verweis nachgeschlagen, bevor
      # irgendetwas veröffentlicht wird.
      - name: Wege prüfen
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: |
          export NEXT_PUBLIC_BASIS_PFAD="/Buch-landingpage-"
          node scripts/pruefe-wege.mjs

      - name: Jekyll abschalten
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # ── Die eigene Domain ───────────────────────────────────────────────────
  #
  # www.trendonix-buecher.de liegt nicht auf GitHub Pages, sondern auf dem
  # Webspace des Anbieters – dort liegt auch das Postfach. Deshalb wird die
  # gebaute Seite dorthin hochgeladen, statt die Domain umzuhängen: Am
  # Mailversand ändert sich nichts, und ein Push auf main erneuert die Seite.
  #
  # Einmalig im Repository einzustellen
  # (Settings → Secrets and variables → Actions):
  #
  #   Variables : SEITEN_DOMAIN  z. B. www.trendonix-buecher.de
  #               FTP_SERVER     die Serveradresse aus der Anbieterverwaltung
  #               FTP_BENUTZER   der FTP-Benutzername
  #               FTP_ZIEL       Zielverzeichnis, meist /  (nur wenn abweichend)
  #               FTP_LOESCHEN   ja  – nur setzen, wenn im Zielverzeichnis
  #                              ausschließlich diese Seite liegt
  #   Secrets   : FTP_PASSWORT   das FTP-Kennwort
  #
  # Fehlt FTP_SERVER, läuft der Auftrag gar nicht erst an – die Seite bleibt
  # dann einfach auf github.io.
  webspace:
    if: vars.FTP_SERVER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Weltdaten prüfen
        run: npm run pruefen

      - name: Bauen
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASIS_PFAD: ''
          NEXT_PUBLIC_BASIS_URL: https://${{ vars.SEITEN_DOMAIN }}
        run: npx next build

      # Ohne Server, der einen falschen Pfad abfängt, muss jeder Verweis
      # stimmen, bevor irgendetwas hochgeladen wird.
      - name: Wege prüfen
        env:
          NEXT_PUBLIC_BASIS_PFAD: ''
        run: node scripts/pruefe-wege.mjs

      - name: Serverregeln beilegen
        run: node scripts/htaccess.mjs

      - name: Hochladen
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_BENUTZER: ${{ vars.FTP_BENUTZER }}
          FTP_PASSWORT: ${{ secrets.FTP_PASSWORT }}
          FTP_ZIEL: ${{ vars.FTP_ZIEL }}
          FTP_LOESCHEN: ${{ vars.FTP_LOESCHEN }}
        run: |
          if [ -z "$FTP_PASSWORT" ]; then
            echo "::error::FTP_PASSWORT fehlt. Repository → Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          ZIEL="${FTP_ZIEL:-/}"
          # Löschen ist nicht die Vorgabe. Wer im Zielverzeichnis noch etwas
          # anderes liegen hat, verlöre es sonst mit dem ersten Upload.
          if [ "$FTP_LOESCHEN" = "ja" ]; then LOESCHEN="--delete"; else LOESCHEN=""; fi
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$FTP_BENUTZER\",\"$FTP_PASSWORT\" \"$FTP_SERVER\";
            mirror -R --parallel=4 --no-perms --ignore-time $LOESCHEN out/ \"$ZIEL\";
          "
          echo "Hochgeladen nach $FTP_SERVER:$ZIEL"
