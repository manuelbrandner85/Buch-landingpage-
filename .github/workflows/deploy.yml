# Baut die Welt und veröffentlicht sie auf GitHub Pages.
#
# Einmalig im Repository einzustellen:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Danach genügt ein Push auf main. Zusätzlich läuft der Bau täglich,
# damit terminierte Journal-Beiträge zu ihrem Datum erscheinen.
name: Welt bauen und veröffentlichen

on:
  push:
    branches: [main]
    # Das Cockpit hat einen eigenen, winzigen Weg auf den Webspace
    # (cockpit.yml). Es aendert sich stuendlich; jedes Mal die ganze Welt neu
    # zu bauen und zu spiegeln waere drei Minuten Arbeit fuer eine geaenderte
    # Zahl. Aendert sich sonst etwas, kommt der Ordner ohnehin mit.
    paths-ignore:
      - 'public/cockpit-eb4e3e9d63d6/**'
  workflow_dispatch:
  # Taeglicher Bau, damit terminierte Journal-Beitraege von selbst erscheinen.
  # Die Seite ist ein statischer Export: Ein Beitrag mit Zukunftsdatum wird erst
  # sichtbar, wenn nach diesem Datum neu gebaut wird. Ohne diesen Eintrag laege
  # der Vorrat still.
  schedule:
    - cron: '20 4 * * *'   # 04:20 UTC — vor dem deutschen Vormittag

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Weltdaten prüfen
        run: npm run pruefen

      # Das Cockpit hat keinen Übersetzer über sich: eine einzelne HTML-Datei,
      # die niemand baut. Ein Tippfehler darin fällt sonst erst auf dem Telefon
      # auf, als weiße Seite.
      - name: Cockpit prüfen
        run: npm run pruefe:cockpit

      # Zwei Adressen, ein Bau.
      #
      # Ohne eigene Domain liegt die Seite in einem Unterordner von github.io –
      # dann braucht sie einen Basispfad. Mit eigener Domain liegt sie in der
      # Wurzel, und der Basispfad muss weg, sonst zeigt jeder Link ins Leere.
      #
      # Umgestellt wird das an einer Stelle: Repository → Settings → Secrets and
      # variables → Actions → Variables → `SEITEN_DOMAIN`, z. B.
      # `www.trendonix-buecher.de`. Ist die Variable leer, bleibt alles wie bisher.
      # Ein Umlautname wird dort in Punycode eingetragen (siehe DOMAIN.md).
      - name: Bauen
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
          NEXT_EXPORT: '1'
        run: |
          if [ -n "$SEITEN_DOMAIN" ]; then
            # Die eigene Domain wird vom Auftrag „webspace“ beliefert. Hier
            # entsteht nur noch der Spiegel unter github.io – gleiche Seite,
            # aber mit Basispfad und für Suchmaschinen gesperrt, damit nicht
            # zwei Adressen denselben Text anbieten.
            export NEXT_PUBLIC_SPIEGEL="1"
          fi
          export NEXT_PUBLIC_BASIS_PFAD="/Buch-landingpage-"
          export NEXT_PUBLIC_BASIS_URL="https://manuelbrandner85.github.io/Buch-landingpage-"
          npx next build

      # Das Cockpit ist kein Teil der Welt. Es liegt in public/, damit es
      # unveraendert auf den Webspace kommt – dort wird der Ordner mit einem
      # Verzeichnisschutz versehen. Auf dem oeffentlichen github.io-Spiegel
      # gaebe es diesen Schutz nicht, und seine Verweise sind bewusst relativ
      # (die App laeuft unter ihrer eigenen Adresse, nicht unter dem
      # Basispfad des Spiegels). Deshalb wird er hier herausgenommen, bevor
      # die Wege geprueft werden.
      - name: Cockpit gehoert nicht in den Spiegel
        run: rm -rf out/cockpit-eb4e3e9d63d6

      # Ein statischer Export hat keinen Server, der einen falschen Pfad noch
      # abfängt. Deshalb wird jeder interne Verweis nachgeschlagen, bevor
      # irgendetwas veröffentlicht wird.
      - name: Wege prüfen
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: |
          export NEXT_PUBLIC_BASIS_PFAD="/Buch-landingpage-"
          node scripts/pruefe-wege.mjs
          node scripts/pruefe-suche.mjs

      - name: Jekyll abschalten
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # ── Die eigene Domain ───────────────────────────────────────────────────
  #
  # www.trendonix-buecher.de liegt nicht auf GitHub Pages, sondern auf dem
  # Webspace des Anbieters – dort liegt auch das Postfach. Deshalb wird die
  # gebaute Seite dorthin hochgeladen, statt die Domain umzuhängen: Am
  # Mailversand ändert sich nichts, und ein Push auf main erneuert die Seite.
  #
  # EINZURICHTEN IST GENAU EINE SACHE.
  #
  #   Repository → Settings → Secrets and variables → Actions → New repository
  #   secret. Name: FTP_ZUGANG. Wert in dieser Form:
  #
  #       benutzer:kennwort@server
  #
  #   also zum Beispiel   f018ae3e:MEINKENNWORT@w021fb9a.kasserver.com
  #
  #   Liegt die Seite nicht im Wurzelverzeichnis des FTP-Zugangs, kommt das
  #   Verzeichnis hinten dran:  …@server/unterordner
  #
  # Server und Benutzer stehen absichtlich mit im Secret und nicht offen im
  # Repository: Es ist öffentlich, und eine dort veröffentlichte FTP-Kennung
  # ist eine Einladung. Im Secret werden alle drei Teile in den Protokollen
  # maskiert.
  #
  #   Aufgeräumt wird von selbst: Was im Zielverzeichnis liegt und nicht mehr
  #   zum Bau gehört, wird beim Hochladen entfernt – aber nur in einem
  #   Verzeichnis, das die Sonde als Dokumentenstamm nachgewiesen hat. Wer das
  #   nicht will, setzt die Variable FTP_LOESCHEN auf `nein`.
  #
  # Ohne das Secret bricht nichts – der Auftrag steigt nach wenigen Sekunden
  # wieder aus, und die Seite bleibt auf github.io.
  webspace:
    runs-on: ubuntu-latest
    steps:
      - name: Zugang vorhanden?
        id: zugang
        env:
          FTP_ZUGANG: ${{ secrets.FTP_ZUGANG }}
        run: |
          if [ -n "$FTP_ZUGANG" ]; then
            echo "da=ja" >> "$GITHUB_OUTPUT"
          else
            echo "da=nein" >> "$GITHUB_OUTPUT"
            echo "::notice title=Webspace übersprungen::Kein Secret FTP_ZUGANG hinterlegt. Die Seite bleibt auf github.io."
          fi

      - uses: actions/checkout@v4
        if: steps.zugang.outputs.da == 'ja'

      - uses: actions/setup-node@v4
        if: steps.zugang.outputs.da == 'ja'
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        if: steps.zugang.outputs.da == 'ja'
        run: npm ci

      - name: Weltdaten prüfen
        if: steps.zugang.outputs.da == 'ja'
        run: npm run pruefen

      # Die Mess-Kennung steht hier im Klartext, und das ist Absicht: Sie ist
      # kein Geheimnis — sie steht in jeder ausgelieferten Seite, die sie
      # benutzt. Im Repository sichtbar zu sein heißt, dass ein Blick in den
      # Verlauf zeigt, seit wann gemessen wird und mit welcher Property.
      # Wer sie überschreiben will, legt die Repository-Variable
      # `GA4_KENNUNG` an (Settings → Secrets and variables → Actions →
      # Variables); ist sie leer, gilt der Wert unten.
      #
      # Property „Trendonix Bücher" (551931799) im Konto Trendonix2, Datenstrom
      # https://www.trendonix-buecher.de. Nur auf der eigenen Domain: Der
      # github.io-Spiegel bekommt die Kennung nicht und misst deshalb nie.
      - name: Bauen
        if: steps.zugang.outputs.da == 'ja'
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_BASIS_PFAD: ''
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
          NEXT_PUBLIC_GA4: ${{ vars.GA4_KENNUNG || 'G-H5TVRKQ9E4' }}
        run: |
          export NEXT_PUBLIC_BASIS_URL="https://${SEITEN_DOMAIN:-www.trendonix-buecher.de}"
          npx next build

      # Ohne Server, der einen falschen Pfad abfängt, muss jeder Verweis
      # stimmen, bevor irgendetwas hochgeladen wird.
      - name: Wege prüfen
        if: steps.zugang.outputs.da == 'ja'
        env:
          NEXT_PUBLIC_BASIS_PFAD: ''
        run: |
          node scripts/pruefe-wege.mjs
          node scripts/pruefe-suche.mjs

      - name: Serverregeln beilegen
        if: steps.zugang.outputs.da == 'ja'
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: node scripts/htaccess.mjs

      - name: Hochladen
        env:
          FTP_ZUGANG: ${{ secrets.FTP_ZUGANG }}
          FTP_ZIEL: ${{ vars.FTP_ZIEL }}
          FTP_LOESCHEN: ${{ vars.FTP_LOESCHEN }}
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: |
          # -f: keine Dateinamen-Ersetzung. Die Ausschlussmuster weiter unten
          # sind für lftp gedacht, nicht für die Shell.
          set -euf +x
          DOMAIN="${SEITEN_DOMAIN:-www.trendonix-buecher.de}"

          # benutzer:kennwort@server[/verzeichnis] auseinandernehmen.
          # Der Benutzer steht vor dem ersten Doppelpunkt, der Server hinter
          # dem letzten Klammeraffen – so darf das Kennwort selbst einen
          # Klammeraffen enthalten, was bei Kennwörtern durchaus vorkommt.
          BENUTZER="${FTP_ZUGANG%%:*}"
          REST="${FTP_ZUGANG#*:}"
          HOST_TEIL="${REST##*@}"
          KENNWORT="${REST%@*}"
          case "$HOST_TEIL" in
            */*) SERVER="${HOST_TEIL%%/*}"; VORGABE="/${HOST_TEIL#*/}" ;;
            *)   SERVER="$HOST_TEIL";       VORGABE="" ;;
          esac
          if [ -z "$BENUTZER" ] || [ -z "$KENNWORT" ] || [ -z "$SERVER" ]; then
            echo "::error title=FTP_ZUGANG unlesbar::Erwartet wird benutzer:kennwort@server"
            exit 1
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp_tun() {
            lftp -c "
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set net:max-retries 2;
              set net:timeout 20;
              set cmd:fail-exit true;
              open -u \"$BENUTZER\",\"$KENNWORT\" \"$SERVER\";
              $1
            "
          }

          # ── Wohin? ────────────────────────────────────────────────────────
          #
          # Zweimal lief der Upload fehlerfrei durch und war trotzdem
          # unsichtbar: Der FTP-Zugang landet woanders als der Dokumentenstamm
          # der Domain. Ein grüner Haken beim Hochladen sagt nur, dass die
          # Dateien angekommen sind – nicht, dass sie am richtigen Ort liegen.
          #
          # Deshalb wird das Ziel nicht geraten, sondern nachgewiesen: eine
          # winzige Datei mit einer Kennung hochladen und über die Domain
          # wieder abrufen. Wo sie auftaucht, ist der Dokumentenstamm.
          OHNE_WWW="${DOMAIN#www.}"
          if [ -n "$VORGABE" ]; then KANDIDATEN="$VORGABE"
          elif [ -n "${FTP_ZIEL:-}" ]; then KANDIDATEN="$FTP_ZIEL"
          else
            # Das Konto steckt im Servernamen: w021fb9a.kasserver.com → w021fb9a.
            KONTO="${SERVER%%.*}"
            # Zuerst das Anmeldeverzeichnis selbst: Bei diesem Anbieter ist
            # der FTP-Nutzer auf den Dokumentenstamm der Domain festgelegt,
            # von der Verbindung aus gesehen ist das schlicht die Wurzel.
            KANDIDATEN="/ /$OHNE_WWW /$DOMAIN /htdocs /htdocs/$OHNE_WWW"
            KANDIDATEN="$KANDIDATEN /$KONTO/$OHNE_WWW /www/htdocs/$KONTO/$OHNE_WWW"
          fi

          MARKE="probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$MARKE" > /tmp/_probe.txt
          ZIEL=""
          ERSTER_BESCHREIBBARER=""
          BESCHRIEBEN=""
          for K in $KANDIDATEN; do
            echo "Prüfe $K"
            if ! lftp_tun "put -O \"$K\" /tmp/_probe.txt -o _probe.txt;" 2>/dev/null; then
              echo "  nicht beschreibbar"
              continue
            fi
            [ -n "$ERSTER_BESCHREIBBARER" ] || ERSTER_BESCHREIBBARER="$K"
            BESCHRIEBEN="$BESCHRIEBEN $K"
            sleep 2
            if curl -fsS --max-time 25 "https://$DOMAIN/_probe.txt" 2>/dev/null | grep -qx "$MARKE"; then
              ZIEL="$K"
              echo "  das ist der Dokumentenstamm"
              break
            fi
            echo "  beschreibbar, aber nicht unter der Domain sichtbar"
          done

          # Die Sonde darf nicht das letzte Wort haben.
          #
          # Eine fehlerhafte .htaccess im Dokumentenstamm beantwortet jede
          # Anfrage mit 500 – auch die nach der Sonde. Dann bestätigt kein
          # Kandidat, und ausgerechnet die Veröffentlichung, die den Fehler
          # behebt, käme nie durch. Eine Sackgasse, aus der man sich nicht
          # herausveröffentlichen kann.
          #
          # Deshalb ist die Sonde ein Nachweis, keine Sperre: Bestätigt keiner,
          # wird der erste beschreibbare Kandidat genommen und laut gewarnt.
          # Das letzte Wort hat die Abfrage der fertigen Seite weiter unten.
          if [ -n "$ZIEL" ]; then
            BESTAETIGT="ja"
          else
            BESTAETIGT="nein"
            if [ -n "$ERSTER_BESCHREIBBARER" ]; then
              ZIEL="$ERSTER_BESCHREIBBARER"
              echo "::warning title=Ziel nicht bestätigt::Kein Kandidat war über https://$DOMAIN erreichbar – vermutlich antwortet der Server gerade mit einem Fehler. Es wird nach $ZIEL geladen und danach geprüft."
            else
              echo "::error title=Kein beschreibbares Verzeichnis::Versucht wurde: $KANDIDATEN"
              exit 1
            fi
          fi
          echo "Ziel: $SERVER$ZIEL"

          # ── Aufräumen ─────────────────────────────────────────────────────
          #
          # Was einmal hochgeladen wurde, bleibt sonst für immer liegen: ein
          # umbenanntes Kapitel, ein ersetztes Bild, ein ganzer Ordner aus
          # einem alten Bau. Deshalb spiegelt der Upload jetzt wirklich – was
          # im Ziel liegt und nicht mehr zum Bau gehört, fliegt mit.
          #
          # Das gilt nur für ein Verzeichnis, das die Sonde als
          # Dokumentenstamm dieser Domain nachgewiesen hat. Wurde nur geraten,
          # wird nichts gelöscht: Ein falsch geratenes Ziel mit --delete wäre
          # der teuerste Fehler, den dieser Auftrag machen kann.
          #
          # Ausgenommen bleibt, was dem Server gehört und nicht uns:
          # .well-known trägt die Bescheinigungen für das Schloss in der
          # Adresszeile – wer den Ordner löscht, nimmt sich das Zertifikat.
          # .htaccess und .htpasswd des Cockpits gehoeren dazu: Der
          # Passwortschutz wird im KAS eingerichtet und liegt deshalb nur auf
          # dem Server, nicht im Repository. Ohne diese Ausnahme wuerde der
          # naechste vollstaendige Abgleich ihn stillschweigend entfernen - der
          # Ordner stuende offen, und niemand haette es gemerkt.
          BEWAHREN="-X .well-known/ -X cgi-bin/ -X logs/ -X stats/ -X error_docs/ -X .ftpquota -X _altlasten*/"
          BEWAHREN="$BEWAHREN -X .htpasswd -X cockpit-*/.htaccess -X cockpit-*/.htpasswd"
          if [ "${FTP_LOESCHEN:-}" = "nein" ]; then
            LOESCHEN=""
            echo "Aufräumen ist abgeschaltet (Variable FTP_LOESCHEN=nein)."
          elif [ "$BESTAETIGT" != "ja" ]; then
            LOESCHEN=""
            echo "::warning title=Nicht aufgeräumt::Das Ziel war nur geraten, nicht nachgewiesen. Es wird nur hinzugefügt, nichts entfernt."
          else
            LOESCHEN="--delete $BEWAHREN"
          fi
          lftp_tun "mirror -R --parallel=4 --no-perms --ignore-time $LOESCHEN out/ \"$ZIEL\";"
          echo "Hochgeladen nach $ZIEL"

          # ── Zweiter Durchgang: die Seiten selbst ──────────────────────────
          #
          # --ignore-time vergleicht nur die Groesse. Das ist fuer 185 MB
          # Bildmaterial richtig -- ohne das laedt jeder Bau alles neu hoch,
          # weil ein frischer Checkout allen Dateien das heutige Datum gibt.
          #
          # Fuer HTML ist es falsch. Aendert sich am Bau nur der Name einer
          # CSS-Datei, bleibt die Seite auf das Byte genau gleich lang -- und
          # wird uebersprungen. Genau das ist am 26.08.2026 passiert: Die neue
          # CSS-Datei lag oben, die Startseite verwies weiter auf die alte,
          # der Auftrag war gruen und die Aenderung unsichtbar.
          #
          # Deshalb gehen Seiten und Textdateien noch einmal, ohne Vergleich.
          # Das sind ein paar hundert kleine Dateien, keine Minute.
          lftp_tun "mirror -R --parallel=4 --no-perms --transfer-all \
            -I *.html -I *.xml -I *.txt -I .htaccess out/ \"$ZIEL\";"
          echo "Seiten erneuert"

          # Die Sonden wieder einsammeln – auch aus den Verzeichnissen, die
          # sich als falsch erwiesen haben.
          for K in $BESCHRIEBEN; do
            if [ "$K" != "$ZIEL" ]; then
              lftp_tun "rm -f \"$K/_probe.txt\";" 2>/dev/null || true
            fi
          done

          # ── Altlasten ─────────────────────────────────────────────────────
          #
          # Zwei frühe Veröffentlichungen liefen fehlerfrei durch und landeten
          # trotzdem daneben: nicht im Dokumentenstamm, sondern im
          # Anmeldeverzeichnis darüber. Dort liegen auch die anderen Ordner
          # des Kontos, deshalb wird da nichts gelöscht.
          #
          # Was aber Zeichen für Zeichen so heißt wie etwas aus diesem Bau,
          # stammt aus diesem Bau. Das wandert in einen Keller – verschoben,
          # nicht gelöscht, umkehrbar mit zwei Klicks. Beim nächsten Mal ist
          # nichts mehr zu finden, dann tut der Schritt gar nichts.
          if [ "$BESTAETIGT" = "ja" ] && [ "$ZIEL" != "/" ]; then
            LISTE="$(lftp_tun "cls -1 /;" 2>/dev/null || true)"
            ALT=""
            for N in $(ls -A out); do
              case "$N" in .*) continue ;; esac
              if printf '%s\n' "$LISTE" | sed 's#/$##' | grep -qx "$N"; then ALT="$ALT $N"; fi
            done
            if [ -n "$ALT" ]; then
              KELLER="/_altlasten-${GITHUB_RUN_ID}"
              BEFEHLE="mkdir -p \"$KELLER\";"
              for N in $ALT; do BEFEHLE="$BEFEHLE mv \"/$N\" \"$KELLER/$N\";"; done
              if lftp_tun "$BEFEHLE" >/dev/null 2>&1; then
                echo "::notice title=Altlasten weggeräumt::$ALT liegen jetzt in $KELLER. Verschoben, nicht gelöscht – der Ordner kann von Hand weg, wenn die Seite steht."
              else
                echo "::warning title=Altlasten liegen noch::Verschieben hat nicht geklappt:$ALT"
              fi
            fi
          fi

      # Der eigentliche Beweis. Alles davor kann grün sein, ohne dass jemand
      # die Seite sehen kann.
      - name: Steht die Seite?
        if: steps.zugang.outputs.da == 'ja'
        env:
          SEITEN_DOMAIN: ${{ vars.SEITEN_DOMAIN }}
        run: |
          DOMAIN="${SEITEN_DOMAIN:-www.trendonix-buecher.de}"
          sleep 5
          FEHLER=0
          for W in "/" "/robots.txt" "/faeden/" "/buch/band-1/"; do
            if curl -fsS --max-time 30 "https://$DOMAIN$W" | grep -q "Trendonix\|User-Agent"; then
              echo "  ok   $W"
            else
              echo "  FEHLT $W"; FEHLER=1
            fi
          done

          # Erreichbar heisst nicht aktuell.
          #
          # Eine alte Startseite antwortet mit 200 und enthaelt „Trendonix" --
          # die Pruefung oben merkt nichts. Die Namen der CSS-Dateien tragen
          # den Inhalt im Namen: Stimmen die der ausgelieferten Seite mit
          # denen des Baus ueberein, ist wirklich der neue Stand oben.
          LOKAL="$(grep -oE '/_next/static/css/[a-z0-9]+\.css' out/index.html | sort -u)"
          LIVE="$(curl -fsS --max-time 30 "https://$DOMAIN/" | grep -oE '/_next/static/css/[a-z0-9]+\.css' | sort -u)"
          if [ -n "$LOKAL" ] && [ "$LOKAL" != "$LIVE" ]; then
            echo "  Bau:  $LOKAL"
            echo "  Live: $LIVE"
            echo "::error title=Alter Stand auf der Domain::Die Seite ist erreichbar, verweist aber auf andere Stilvorlagen als der Bau. Der Upload hat die Seiten nicht erneuert."
            FEHLER=1
          else
            echo "  ok   Stand stimmt ($LOKAL)"
          fi
          if [ "$FEHLER" = "1" ]; then
            echo "::error title=Seite nicht erreichbar::Der Upload lief durch, aber https://$DOMAIN liefert nicht die neue Seite."
            exit 1
          fi
          echo "https://$DOMAIN steht."
