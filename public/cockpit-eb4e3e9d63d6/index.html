<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Trendonix Dashboard</title>
<meta name="theme-color" content="#060A14">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --nacht:#060A14; --tiefe:#0C1220; --gold:#E3C88B; --gold-tief:#A8863F;
  --papier:#F1ECE0; --staub:#9C9482; --rot:#7C1622; --gruen:#4E7D5A;
  --rand:1rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--nacht); color:var(--papier); font-size:16px; line-height:1.5;
  font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.15}
a{color:var(--gold)}

/* ---- Kopf ---- */
header{
  position:sticky; top:0; z-index:10; background:rgba(6,10,20,.92);
  backdrop-filter:blur(12px); border-bottom:1px solid rgba(227,200,139,.18);
  padding:calc(.7rem + env(safe-area-inset-top,0px)) var(--rand) .7rem;
  display:flex; align-items:center; gap:.7rem;
}
header img{width:34px;height:34px;border-radius:6px;flex:0 0 auto}
.marke{flex:1;min-width:0}
.marke b{display:block;font-family:Georgia,serif;font-weight:400;font-size:1.05rem;
  letter-spacing:.02em}
.marke span{display:block;font-size:.7rem;color:var(--staub)}
.marke span.alt{color:var(--gold-tief)}
button.neu{
  background:none;border:1px solid rgba(227,200,139,.35);color:var(--gold);
  border-radius:999px;padding:.45rem .8rem;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;font-family:inherit;cursor:pointer;flex:0 0 auto
}
button.neu:active{background:rgba(227,200,139,.12)}
button.neu[aria-busy="true"]{opacity:.5}

.warnung{background:rgba(124,22,34,.35);border-bottom:1px solid rgba(227,200,139,.2);
  padding:.55rem var(--rand);font-size:.78rem;color:var(--papier)}

main{padding:0 var(--rand)}
section{margin:1.6rem 0}
h2{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  font-family:Georgia,serif;margin-bottom:.7rem}

/* ---- Karten ---- */
.karte{background:var(--tiefe);border:1px solid rgba(227,200,139,.14);
  border-radius:10px;padding:1rem}
.buchkopf h3{font-size:1.25rem;color:var(--papier)}
.buchkopf em{font-style:italic;color:var(--gold);font-family:Georgia,serif;font-size:.95rem}
.zeile{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.kachel{flex:1 1 30%;min-width:92px;background:rgba(227,200,139,.05);
  border:1px solid rgba(227,200,139,.12);border-radius:8px;padding:.6rem .7rem}
.kachel .wert{font-family:Georgia,serif;font-size:1.5rem;color:var(--gold);line-height:1.1}
.kachel .wert.klein{font-size:1.05rem}
.kachel .was{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--staub);margin-top:.25rem}
.kachel.leer .wert{color:var(--staub)}
/* Die Kategorienraenge als Zeilen, nicht als Kacheln: „Vor- & Fruehgeschichte"
   passt in kein Drittel eines Telefons, ohne in den Nachbarn zu laufen. */
.rangliste{margin-top:.9rem;border-top:1px solid rgba(227,200,139,.12)}
.rangliste li{display:flex;justify-content:space-between;align-items:baseline;
  gap:.8rem;padding:.45rem 0;border-bottom:1px solid rgba(227,200,139,.08);font-size:.86rem}
.rangliste li:last-child{border-bottom:0}
.rangliste b{font-family:Georgia,serif;font-weight:400;color:var(--gold);font-size:1.05rem}

ul{list-style:none}
.ausgaben li{display:flex;justify-content:space-between;gap:.6rem;padding:.55rem 0;
  border-bottom:1px solid rgba(227,200,139,.1);font-size:.86rem}
.ausgaben li:last-child{border-bottom:0}
.ausgaben .zustand{color:var(--staub);font-size:.76rem;text-align:right}

.kanaele{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.kanal{background:var(--tiefe);border:1px solid rgba(227,200,139,.14);
  border-radius:10px;padding:.8rem}
.kanal b{display:block;font-family:Georgia,serif;font-weight:400;font-size:.95rem}
.kanal .griff{display:block;font-size:.64rem;color:var(--staub);overflow-wrap:anywhere}
.kanal .zahl{font-family:Georgia,serif;font-size:1.6rem;color:var(--gold);margin-top:.45rem;
  line-height:1}
.kanal .zahl.leer{font-size:.9rem;color:var(--staub)}
.kanal .unten{font-size:.68rem;color:var(--staub);margin-top:.3rem}

.lauf li{display:flex;gap:.7rem;padding:.7rem 0;border-bottom:1px solid rgba(227,200,139,.1)}
.lauf li:last-child{border-bottom:0}
.lauf .punkt{flex:0 0 auto;width:7px;height:7px;border-radius:50%;
  background:var(--gold-tief);margin-top:.5rem}
.lauf li.frisch .punkt{background:var(--gold);box-shadow:0 0 0 4px rgba(227,200,139,.16)}
.lauf .text{display:block;font-size:.87rem}
.lauf .meta{display:block;font-size:.68rem;color:var(--staub);margin-top:.25rem;
  text-transform:uppercase;letter-spacing:.08em}
.lauf .fahne{color:var(--gold);margin-left:.4rem;letter-spacing:.1em}

.offen li{display:flex;gap:.7rem;padding:.75rem 0;border-bottom:1px solid rgba(227,200,139,.1)}
.offen li:last-child{border-bottom:0}
.offen .stufe{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:.45rem}
.stufe.hoch{background:var(--rot);box-shadow:0 0 0 3px rgba(124,22,34,.3)}
.stufe.mittel{background:var(--gold-tief)}
.stufe.klein{background:rgba(156,148,130,.6)}
.offen b{font-weight:600;font-size:.9rem;display:block}
.offen .warum{display:block;font-size:.78rem;color:var(--staub);margin-top:.2rem}
.offen .wer{display:block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-tief);margin-top:.35rem}

.hinweis{font-size:.78rem;color:var(--staub);font-style:italic;margin-top:.6rem}
footer{padding:1.5rem var(--rand) 0;font-size:.7rem;color:var(--staub);text-align:center}
.tipp{margin:1.2rem var(--rand);padding:.8rem;border:1px dashed rgba(227,200,139,.3);
  border-radius:8px;font-size:.8rem;color:var(--staub)}
.tipp b{color:var(--gold);font-weight:400}
@media (min-width:640px){
  :root{--rand:1.6rem}
  body{max-width:46rem;margin:0 auto}
  .kanaele{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header>
  <img src="icon-192.png" alt="">
  <span class="marke">
    <b>Trendonix Dashboard</b>
    <span id="stand">wird geladen …</span>
  </span>
  <button class="neu" id="knopf" type="button">Neu laden</button>
</header>

<div class="warnung" id="warnung" hidden></div>

<main id="inhalt"></main>

<div class="tipp" id="tipp" hidden>
  <b>Auf den Startbildschirm legen:</b> im Chrome-Menü oben rechts auf
  „Zum Startbildschirm hinzufügen“. Danach startet das Dashboard wie eine App,
  mit eigenem Symbol und ohne Adressleiste.
</div>

<footer>Alle Zahlen sind abgelesen, nicht geschätzt. Fehlt eine, steht das dabei.</footer>

<script>
(function () {
  'use strict';

  var inhalt = document.getElementById('inhalt');
  var standZeile = document.getElementById('stand');
  var warnung = document.getElementById('warnung');
  var knopf = document.getElementById('knopf');

  // Wann der Besitzer zuletzt hingesehen hat. Alles, was danach passiert ist,
  // bekommt eine Fahne - sonst muesste er jedes Mal die ganze Liste lesen.
  var ZULETZT = 'trendonix-zuletzt';
  var zuletzt = 0;
  try { zuletzt = parseInt(localStorage.getItem(ZULETZT) || '0', 10) || 0; } catch (e) {}

  function zahl(n) {
    if (n === null || n === undefined) return null;
    return n.toLocaleString('de-DE');
  }
  function euro(n) {
    return n === null || n === undefined ? null : n.toFixed(2).replace('.', ',') + ' €';
  }
  function datum(iso) {
    if (!iso) return '';
    var t = new Date(iso);
    return t.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function vorwie(iso) {
    var min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 2) return 'gerade eben';
    if (min < 60) return 'vor ' + min + ' Minuten';
    var std = Math.round(min / 60);
    if (std < 24) return 'vor ' + std + (std === 1 ? ' Stunde' : ' Stunden');
    var tage = Math.round(std / 24);
    return 'vor ' + tage + (tage === 1 ? ' Tag' : ' Tagen');
  }
  function h(text) {
    return String(text).replace(/[&<>"]/g, function (z) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[z];
    });
  }

  function malen(d) {
    var teile = [];

    // ---- Das Buch ----
    var b = d.buch || {};
    var rez = b.rezensionen || {};
    teile.push(
      '<section><h2>Das Buch</h2><div class="karte buchkopf">'
      + '<h3>' + h(b.titel || '') + '</h3>'
      + (b.untertitel ? '<em>' + h(b.untertitel) + '</em>' : '')
      + '<div class="zeile">'
      + kachel(zahl(rez.anzahl), 'Rezensionen', rez.anzahl === 0)
      + kachel(rez.schnitt ? rez.schnitt.toFixed(1).replace('.', ',') : '–',
               'Sterne', !rez.schnitt)
      + kachel(b.rangGesamt ? '#' + zahl(b.rangGesamt) : '–', 'Rang in Büchern', !b.rangGesamt)
      + '</div>'
      + (b.kategorien && b.kategorien.length
          ? '<ul class="rangliste">' + b.kategorien.map(function (k) {
              return '<li><span>' + h(k.name) + '</span><b>#' + zahl(k.platz) + '</b></li>';
            }).join('') + '</ul>'
          : '')
      + (b.rangStand ? '<p class="hinweis">Rang abgelesen am ' + datum(b.rangStand)
          + '. Ein Rang entsteht erst nach dem ersten Verkauf.</p>' : '')
      + '</div></section>',
    );

    // ---- Ausgaben ----
    if (b.ausgaben && b.ausgaben.length) {
      teile.push('<section><h2>Ausgaben</h2><div class="karte"><ul class="ausgaben">'
        + b.ausgaben.map(function (a) {
            return '<li><span>' + h(a.form) + '<br><span class="zustand">'
              + h(a.haendler || '') + '</span></span>'
              + '<span class="zustand">' + (euro(a.preis) || '—') + '<br>'
              + h(a.zustand || '') + '</span></li>';
          }).join('')
        + '</ul></div></section>');
    }

    // ---- Verkäufe ----
    var v = d.verkaeufe || {};
    teile.push('<section><h2>Verkäufe</h2><div class="karte">'
      + (v.gelesen && v.tage && v.tage.length
          ? '<div class="zeile">' + v.tage.slice(0, 3).map(function (t) {
              return kachel(zahl(t.gesamt), datum(t.d));
            }).join('') + '</div>'
          : '<p class="hinweis">' + h(v.hinweis || 'Noch keine Daten.') + '</p>')
      + '</div></section>');

    // ---- Kanäle ----
    if (d.kanaele && d.kanaele.length) {
      teile.push('<section><h2>Kanäle</h2><div class="kanaele">'
        + d.kanaele.map(function (k) {
            var hat = k.follower !== null && k.follower !== undefined;
            return '<div class="kanal"><b>' + h(k.name) + '</b>'
              + '<span class="griff">' + h(k.handle || '') + '</span>'
              + '<div class="zahl' + (hat ? '' : ' leer') + '">'
              + (hat ? zahl(k.follower) : 'keine Daten') + '</div>'
              + '<div class="unten">' + (hat ? 'Follower' : '')
              + (k.reaktionen ? ' · ' + zahl(k.reaktionen) + ' '
                  + h(k.reaktionenLabel || 'Reaktionen') : '')
              + (k.stand ? '<br>Stand ' + datum(k.stand) : '')
              + (k.notiz ? '<br>' + h(k.notiz) : '')
              + '</div></div>';
          }).join('')
        + '</div></section>');
    }

    // ---- Was sich tut ----
    if (d.aktivitaet && d.aktivitaet.length) {
      var frischeZahl = 0;
      var eintraege = d.aktivitaet.map(function (a) {
        var zeit = new Date(a.zeit).getTime();
        var frisch = zeit > zuletzt;
        if (frisch) frischeZahl++;
        return '<li class="' + (frisch ? 'frisch' : '') + '"><span class="punkt"></span>'
          + '<span><span class="text">' + h(a.text) + '</span>'
          + '<span class="meta">' + h(a.kanal || '') + ' · ' + vorwie(a.zeit)
          + (frisch ? '<span class="fahne">NEU</span>' : '') + '</span></span></li>';
      }).join('');
      teile.push('<section><h2>Was sich tut'
        + (frischeZahl ? ' · ' + frischeZahl + ' neu' : '') + '</h2>'
        + '<div class="karte"><ul class="lauf">' + eintraege + '</ul></div></section>');
    }

    // ---- Offene Punkte ----
    if (d.offen && d.offen.length) {
      teile.push('<section><h2>Offene Punkte</h2><div class="karte"><ul class="offen">'
        + d.offen.map(function (o) {
            return '<li><span class="stufe ' + h(o.stufe || 'klein') + '"></span><span>'
              + '<b>' + h(o.titel) + '</b>'
              + (o.warum ? '<span class="warum">' + h(o.warum) + '</span>' : '')
              + (o.wer ? '<span class="wer">' + h(o.wer) + '</span>' : '')
              + '</span></li>';
          }).join('')
        + '</ul></div></section>');
    }

    inhalt.innerHTML = teile.join('');
    standZeile.textContent = 'Stand ' + vorwie(d.stand);
    standZeile.className = '';
    try { localStorage.setItem(ZULETZT, String(Date.now())); } catch (e) {}
  }

  function kachel(wert, was, leer, klein) {
    return '<div class="kachel' + (leer ? ' leer' : '') + '">'
      + '<div class="wert' + (klein ? ' klein' : '') + '">' + h(wert === null ? '–' : wert)
      + '</div><div class="was">' + h(was) + '</div></div>';
  }

  var laeuft = false;
  function holen(vonHand) {
    if (laeuft) return;
    laeuft = true;
    knopf.setAttribute('aria-busy', 'true');
    fetch('cockpit.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (a) { if (!a.ok) throw new Error(a.status); return a.json(); })
      .then(function (d) {
        warnung.hidden = true;
        try { localStorage.setItem('trendonix-daten', JSON.stringify(d)); } catch (e) {}
        malen(d);
      })
      .catch(function () {
        var alt = null;
        try { alt = JSON.parse(localStorage.getItem('trendonix-daten') || 'null'); } catch (e) {}
        if (alt) {
          malen(alt);
          warnung.hidden = false;
          warnung.textContent = 'Kein Netz — angezeigt wird der letzte bekannte Stand von '
            + vorwie(alt.stand) + '.';
        } else {
          standZeile.textContent = 'nicht erreichbar';
          standZeile.className = 'alt';
          inhalt.innerHTML = '<section><div class="karte"><p class="hinweis">'
            + 'Keine Verbindung und noch nichts gespeichert. Einmal mit Netz öffnen, '
            + 'danach läuft es auch offline.</p></div></section>';
        }
      })
      .finally(function () {
        laeuft = false;
        knopf.removeAttribute('aria-busy');
      });
  }

  knopf.addEventListener('click', function () { holen(true); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) holen(false);
  });
  setInterval(function () { if (!document.hidden) holen(false); }, 60000);
  holen(false);

  // Der Hinweis zum Installieren verschwindet, sobald die App installiert ist.
  var alleinstehend = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (!alleinstehend) document.getElementById('tipp').hidden = false;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
