<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Trendonix Dashboard</title>
<meta name="theme-color" content="#060A14">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --nacht:#060A14; --tiefe:#0C1220; --gold:#E3C88B; --gold-tief:#A8863F;
  --papier:#F1ECE0; --staub:#9C9482; --rot:#7C1622; --gruen:#5C8A68;
  --rand:1rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--nacht);color:var(--papier);font-size:16px;line-height:1.5;
  font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.15}
a{color:var(--gold)}

header{position:sticky;top:0;z-index:10;background:rgba(6,10,20,.93);
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(227,200,139,.18);
  padding:calc(.7rem + env(safe-area-inset-top,0px)) var(--rand) .7rem;
  display:flex;align-items:center;gap:.7rem}
header img{width:34px;height:34px;border-radius:6px;flex:0 0 auto}
.marke{flex:1;min-width:0}
.marke b{display:block;font-family:Georgia,serif;font-weight:400;font-size:1.05rem}
.marke span{display:block;font-size:.7rem;color:var(--staub)}
.marke span.alt{color:var(--gold-tief)}
button.neu{background:none;border:1px solid rgba(227,200,139,.35);color:var(--gold);
  border-radius:999px;padding:.45rem .8rem;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;font-family:inherit;cursor:pointer;flex:0 0 auto}
button.neu:active{background:rgba(227,200,139,.12)}
button.neu[aria-busy="true"]{opacity:.5}
.warnung{background:rgba(124,22,34,.35);border-bottom:1px solid rgba(227,200,139,.2);
  padding:.55rem var(--rand);font-size:.78rem}

main{padding:0 var(--rand)}
section{margin:1.6rem 0}
h2{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  font-family:Georgia,serif;margin-bottom:.7rem}
.karte{background:var(--tiefe);border:1px solid rgba(227,200,139,.14);
  border-radius:10px;padding:1rem}
.buchkopf h3{font-size:1.25rem}
.buchkopf em{font-style:italic;color:var(--gold);font-family:Georgia,serif;font-size:.95rem}

.zeile{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.kachel{flex:1 1 30%;min-width:92px;background:rgba(227,200,139,.05);
  border:1px solid rgba(227,200,139,.12);border-radius:8px;padding:.6rem .7rem}
.kachel .wert{font-family:Georgia,serif;font-size:1.5rem;color:var(--gold);line-height:1.1}
.kachel .was{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--staub);margin-top:.25rem}
.kachel.leer .wert{color:var(--staub);font-size:1rem}
.trend{font-size:.72rem;margin-top:.3rem;display:block}
.trend.gut{color:var(--gruen)} .trend.schlecht{color:#C0685F}

ul{list-style:none}
.rangliste{margin-top:.9rem;border-top:1px solid rgba(227,200,139,.12)}
.rangliste li,.suchliste li{display:flex;justify-content:space-between;align-items:baseline;
  gap:.8rem;padding:.45rem 0;border-bottom:1px solid rgba(227,200,139,.08);font-size:.86rem}
.rangliste li:last-child,.suchliste li:last-child{border-bottom:0}
.rangliste b,.suchliste b{font-family:Georgia,serif;font-weight:400;color:var(--gold);font-size:1.05rem}
.ausgaben li{display:flex;justify-content:space-between;gap:.6rem;padding:.55rem 0;
  border-bottom:1px solid rgba(227,200,139,.1);font-size:.86rem}
.ausgaben li:last-child{border-bottom:0}
.ausgaben .zustand{color:var(--staub);font-size:.76rem;text-align:right}

.balken{display:block;width:100%;height:70px;margin-top:.9rem}
.balken rect{fill:var(--gold-tief)}
.balken rect.hoch{fill:var(--gold)}

.kanaele{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.kanal{background:var(--tiefe);border:1px solid rgba(227,200,139,.14);
  border-radius:10px;padding:.8rem}
.kanal b{display:block;font-family:Georgia,serif;font-weight:400;font-size:.95rem}
.kanal .griff{display:block;font-size:.64rem;color:var(--staub);overflow-wrap:anywhere}
.kanal .zahl{font-family:Georgia,serif;font-size:1.6rem;color:var(--gold);margin-top:.45rem;line-height:1}
.kanal .zahl.leer{font-size:.9rem;color:var(--staub)}
.kanal .unten{display:block;font-size:.68rem;color:var(--staub);margin-top:.3rem}

.lauf li{display:flex;gap:.7rem;padding:.7rem 0;border-bottom:1px solid rgba(227,200,139,.1)}
.lauf li:last-child{border-bottom:0}
.lauf .punkt{flex:0 0 auto;width:7px;height:7px;border-radius:50%;
  background:var(--gold-tief);margin-top:.5rem}
.lauf li.frisch .punkt{background:var(--gold);box-shadow:0 0 0 4px rgba(227,200,139,.16)}
.lauf .text{display:block;font-size:.87rem}
.lauf .meta{display:block;font-size:.68rem;color:var(--staub);margin-top:.25rem;
  text-transform:uppercase;letter-spacing:.08em}
.lauf .fahne{color:var(--gold);margin-left:.4rem;letter-spacing:.1em}

.vorschlag{border-bottom:1px solid rgba(227,200,139,.1);padding:.85rem 0}
.vorschlag:last-child{border-bottom:0}
.vorschlag b{display:block;font-size:.95rem;font-family:Georgia,serif;font-weight:400;color:var(--papier)}
.vorschlag .warum{display:block;font-size:.8rem;color:var(--staub);margin-top:.3rem}
.vorschlag .gewinn{display:block;font-size:.8rem;color:var(--gold);margin-top:.35rem}
.vorschlag .wer{display:block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-tief);margin-top:.4rem}

.offen li{display:flex;gap:.7rem;padding:.75rem 0;border-bottom:1px solid rgba(227,200,139,.1)}
.offen li:last-child{border-bottom:0}
.offen .stufe{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:.45rem}
.stufe.hoch{background:var(--rot);box-shadow:0 0 0 3px rgba(124,22,34,.3)}
.stufe.mittel{background:var(--gold-tief)}
.stufe.klein{background:rgba(156,148,130,.6)}
.offen b{font-weight:600;font-size:.9rem;display:block}
.offen .warum{display:block;font-size:.78rem;color:var(--staub);margin-top:.2rem}
.offen .wer{display:block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-tief);margin-top:.35rem}

.technik{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;font-size:.74rem;color:var(--staub)}
.technik b{color:var(--papier);font-weight:600}
.hinweis{font-size:.78rem;color:var(--staub);font-style:italic;margin-top:.6rem}
footer{padding:1.5rem var(--rand) 0;font-size:.7rem;color:var(--staub);text-align:center}
.tipp{margin:1.2rem var(--rand);padding:.8rem;border:1px dashed rgba(227,200,139,.3);
  border-radius:8px;font-size:.8rem;color:var(--staub)}
.tipp b{color:var(--gold);font-weight:400}
@media (min-width:640px){
  :root{--rand:1.6rem}
  body{max-width:48rem;margin:0 auto}
  .kanaele{grid-template-columns:repeat(3,1fr)}
}

/* ---------- Reiter, Überblick, Lücken ---------- */
.reiter{display:flex;gap:.25rem;overflow-x:auto;margin:0 0 1rem;padding:.25rem;
  position:sticky;top:0;z-index:5;background:var(--nacht,#060A14);
  scrollbar-width:none}
.reiter::-webkit-scrollbar{display:none}
.reiter button{flex:0 0 auto;border:1px solid rgba(255,255,255,.10);background:transparent;
  color:inherit;font:inherit;font-size:.86rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.5rem .9rem;border-radius:999px;opacity:.55;cursor:pointer}
.reiter button.an{opacity:1;border-color:rgba(214,181,106,.55);
  background:rgba(214,181,106,.10);color:var(--gold,#d6b56a)}
.zeile.gross .kachel .wert{font-size:clamp(1.5rem,7vw,2.1rem)}
.zeile.gross{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.zeile.gross .kachel{flex:none;min-width:0}
.kachel .zusatz{display:block;font-size:.7rem;opacity:.5;margin-top:.2rem}
.ampel{margin-top:.9rem;padding:.55rem .75rem;border-radius:.6rem;font-size:.85rem;
  border:1px solid rgba(255,255,255,.10)}
.ampel.gut{border-color:rgba(120,190,140,.35);background:rgba(120,190,140,.08)}
.ampel.schlecht{border-color:rgba(210,120,110,.40);background:rgba(210,120,110,.10)}
.luecken{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.luecken li{display:block}
.luecken li::before{display:none}
.luecken b{display:block}
.kaputt{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.35rem;font-size:.8rem}
.kaputt li{display:flex;gap:.5rem;align-items:baseline}
.kaputt li::before{display:none}
.kaputt b{color:#e0908a}
.kaputt span{word-break:break-all;opacity:.6}

/* ---------- Kurven ---------- */
.kurvenblock{margin-top:1rem}
.kurventitel{display:block;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);opacity:.7;margin-bottom:.35rem}
svg.kurve{display:block;width:100%;height:38px;overflow:visible}
svg.kurve polyline{fill:none;stroke:var(--gold);stroke-width:1.4;vector-effect:non-scaling-stroke;
  stroke-linejoin:round;stroke-linecap:round}
svg.kurve circle{fill:var(--gold);vector-effect:non-scaling-stroke}
.kurvenfuss{display:flex;justify-content:space-between;font-size:.68rem;opacity:.45;margin-top:.3rem}
.kanal svg.kurve{height:22px;margin:.45rem 0 .1rem}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <span class="marke"><b>Trendonix Dashboard</b><span id="stand">wird geladen …</span></span>
  <button class="neu" id="knopf" type="button">Neu laden</button>
</header>
<div class="warnung" id="warnung" hidden></div>
<main id="inhalt"></main>
<div class="tipp" id="tipp" hidden>
  <b>Auf den Startbildschirm legen:</b> im Chrome-Menü oben rechts auf
  „Zum Startbildschirm hinzufügen“. Danach startet das Dashboard wie eine App.
</div>
<footer>Alle Zahlen sind abgelesen, nicht geschätzt. Fehlt eine, steht das dabei.</footer>

<script>
(function () {
  'use strict';
  var inhalt = document.getElementById('inhalt');
  var standZeile = document.getElementById('stand');
  var warnung = document.getElementById('warnung');
  var knopf = document.getElementById('knopf');
  var ZULETZT = 'trendonix-zuletzt';
  var zuletzt = 0;
  try { zuletzt = parseInt(localStorage.getItem(ZULETZT) || '0', 10) || 0; } catch (e) {}

  var da = function (w) { return w !== null && w !== undefined; };
  function zahl(n) { return da(n) ? n.toLocaleString('de-DE') : null; }
  function euro(n) { return da(n) ? n.toFixed(2).replace('.', ',') + ' €' : null; }
  function datum(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('de-DE',
      { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function kurzDatum(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  }
  function vorwie(iso) {
    var min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 2) return 'gerade eben';
    if (min < 60) return 'vor ' + min + ' Minuten';
    var std = Math.round(min / 60);
    if (std < 24) return 'vor ' + std + (std === 1 ? ' Stunde' : ' Stunden');
    var tage = Math.round(std / 24);
    return 'vor ' + tage + (tage === 1 ? ' Tag' : ' Tagen');
  }
  function h(t) {
    return String(t).replace(/[&<>"]/g, function (z) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[z];
    });
  }
  function kachel(wert, was, zusatz) {
    var leer = !da(wert) || wert === '–';
    return '<div class="kachel' + (leer ? ' leer' : '') + '">'
      + '<div class="wert">' + h(leer ? 'keine Daten' : wert) + '</div>'
      + '<div class="was">' + h(was) + '</div>' + (zusatz || '') + '</div>';
  }
  // Weniger ist besser beim Rang, mehr ist besser bei allem anderen.
  function trend(jetzt, vorher, kleinerIstBesser) {
    if (!da(jetzt) || !da(vorher) || jetzt === vorher) return '';
    var rauf = jetzt > vorher;
    var gut = kleinerIstBesser ? !rauf : rauf;
    var d = Math.abs(jetzt - vorher);
    return '<span class="trend ' + (gut ? 'gut' : 'schlecht') + '">'
      + (rauf ? '▲' : '▼') + ' ' + zahl(d) + '</span>';
  }

  function balken(tage, feld) {
    var werte = tage.map(function (t) { return t[feld] || 0; });
    var hoch = Math.max.apply(null, werte.concat([1]));
    var b = 100 / werte.length;
    return '<svg class="balken" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">'
      + werte.map(function (w, i) {
          var hoehe = Math.max(1, (w / hoch) * 38);
          return '<rect class="' + (w === hoch && w > 0 ? 'hoch' : '') + '" x="'
            + (i * b + b * 0.15).toFixed(2) + '" y="' + (40 - hoehe).toFixed(2)
            + '" width="' + (b * 0.7).toFixed(2) + '" height="' + hoehe.toFixed(2) + '"/>';
        }).join('')
      + '</svg>';
  }

  /**
   * Eine Kurve aus Tagesständen.
   *
   * Kein Raster, keine Achsenbeschriftung, keine Legende — auf einem Telefon
   * ist beides Platzverschwendung. Was zählt, steht daneben: erster Wert,
   * letzter Wert, wie viele Tage dazwischen liegen. Beim Rang zeigt die Kurve
   * nach oben, wenn die Zahl kleiner wird; alles andere hätte man jedes Mal
   * neu im Kopf umdrehen müssen.
   */
  function kurve(punkte, invers) {
    if (!punkte || punkte.length < 2) return '';
    var w = punkte.map(function (p) { return p.v; });
    var min = Math.min.apply(null, w), max = Math.max.apply(null, w);
    var spanne = max - min || 1;
    var B = 100, H = 34;
    var xy = punkte.map(function (p, i) {
      // Ein Rand von zwei Einheiten links und rechts: sonst klebt der Punkt
      // des jüngsten Tages an der Kartenkante und wird halb abgeschnitten.
      var x = punkte.length === 1 ? B / 2 : 2 + (i / (punkte.length - 1)) * (B - 4);
      var teil = (p.v - min) / spanne;
      var y = H - (invers ? 1 - teil : teil) * H;
      return x.toFixed(2) + ',' + y.toFixed(2);
    });
    var letzterX = (B - 2).toFixed(2);
    var letzterY = xy[xy.length - 1].split(',')[1];
    return '<svg class="kurve" viewBox="0 0 ' + B + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">'
      + '<polyline points="' + xy.join(' ') + '"/>'
      + '<circle cx="' + letzterX + '" cy="' + letzterY + '" r="1.6"/></svg>';
  }

  function kurveBlock(titel, punkte, invers, formt) {
    if (!punkte || punkte.length < 2) return '';
    var erst = punkte[0], letzt = punkte[punkte.length - 1];
    var f = formt || function (v) { return zahl(v); };
    return '<div class="kurvenblock"><span class="kurventitel">' + h(titel) + '</span>'
      + kurve(punkte, invers)
      + '<span class="kurvenfuss"><span>' + h(f(erst.v)) + '</span>'
      + '<span>' + punkte.length + ' Tage</span>'
      + '<span>' + h(f(letzt.v)) + '</span></span></div>';
  }

  function malen(d) {
    var t = [];

    // ---- Überblick: die fünf Zahlen, für die man das Telefon herauszieht ----
    var ub = d.buch || {}, urez = ub.rezensionen || {}, uv = (d.verkaeufe || {}).summe30 || {};
    var ur = d.reichweite || {}, ut = d.technik || {}, vl = d.verlauf || {};
    var verkauft = null;
    if (da(uv.kindle) || da(uv.taschenbuch)) verkauft = (uv.kindle || 0) + (uv.taschenbuch || 0);
    var gruen = ut.deploy === 'erfolgreich';
    t.push('<section data-g="heute"><h2>Überblick</h2><div class="karte">'
      + '<div class="zeile gross">'
      + kachel(da(ub.rangGesamt) ? '#' + zahl(ub.rangGesamt) : null, 'Rang',
               trend(ub.rangGesamt, ub.rangVorher, true))
      + kachel(zahl(urez.anzahl), 'Rezensionen')
      + kachel(zahl(ur.gesamt), 'Follower gesamt',
               da(ur.gesamt) && ur.kanaeleGezaehlt < ur.kanaeleGesamt
                 ? '<span class="zusatz">aus ' + ur.kanaeleGezaehlt + ' von ' + ur.kanaeleGesamt + ' Kanälen</span>' : '')
      + kachel(zahl(verkauft), 'Verkauft · 30 Tage')
      + '</div>'
      + '<div class="ampel ' + (gruen ? 'gut' : 'schlecht') + '">'
      + (gruen ? 'Die Seite steht' : 'Veröffentlichung: ' + h(ut.deploy || 'unbekannt'))
      + (ut.deployWann ? ' · zuletzt ' + vorwie(ut.deployWann) : '') + '</div>'
      + kurveBlock('Rang · Verlauf', vl.rang, true, function (v) { return '#' + zahl(v); })
      + kurveBlock('Follower gesamt · Verlauf', vl.reichweite, false)
      + (vl.tage < 2
          ? '<p class="hinweis">Die Kurven beginnen morgen — heute steht der erste Tagesstand.</p>' : '')
      + '</div></section>');

    // ---- Buch ----
    var b = d.buch || {}, rez = b.rezensionen || {};
    t.push('<section data-g="buch"><h2>Das Buch</h2><div class="karte buchkopf">'
      + '<h3>' + h(b.titel || '') + '</h3>'
      + (b.untertitel ? '<em>' + h(b.untertitel) + '</em>' : '')
      + '<div class="zeile">'
      + kachel(zahl(rez.anzahl), 'Rezensionen')
      + kachel(rez.schnitt ? rez.schnitt.toFixed(1).replace('.', ',') : '–', 'Sterne')
      + kachel(da(b.rangGesamt) ? '#' + zahl(b.rangGesamt) : '–', 'Rang in Büchern',
               trend(b.rangGesamt, b.rangVorher, true))
      + '</div>'
      + (b.kategorien && b.kategorien.length
          ? '<ul class="rangliste">' + b.kategorien.map(function (k) {
              return '<li><span>' + h(k.name) + '</span><b>#' + zahl(k.platz) + '</b></li>';
            }).join('') + '</ul>' : '')
      + (b.rangStand ? '<p class="hinweis">Rang abgelesen am ' + datum(b.rangStand) + '.</p>' : '')
      + '</div></section>');

    // ---- Ausgaben ----
    if (b.ausgaben && b.ausgaben.length) {
      t.push('<section data-g="buch"><h2>Ausgaben</h2><div class="karte"><ul class="ausgaben">'
        + b.ausgaben.map(function (a) {
            return '<li><span>' + h(a.form) + '<br><span class="zustand">'
              + h(a.haendler || '') + '</span></span><span class="zustand">'
              + (euro(a.preis) || '—') + '<br>' + h(a.zustand || '') + '</span></li>';
          }).join('') + '</ul></div></section>');
    }

    // ---- Verkäufe ----
    var v = d.verkaeufe || {}, s30 = v.summe30 || {};
    t.push('<section data-g="buch"><h2>Verkäufe · 30 Tage</h2><div class="karte">'
      + '<div class="zeile">' + kachel(zahl(s30.kindle), 'Kindle')
      + kachel(zahl(s30.taschenbuch), 'Taschenbuch')
      + kachel(zahl(s30.kenp), 'KENP-Seiten') + '</div>'
      + (v.gelesen && v.tage && v.tage.length
          ? balken(v.tage, 'gesamt')
            + '<p class="hinweis">' + v.tage.length + ' Tage, links alt, rechts heute.</p>'
          : '<p class="hinweis">' + h(v.hinweis || 'Noch keine Daten.') + '</p>')
      + '</div></section>');

    // ---- Besucher ----
    var g = d.besucher || {};
    t.push('<section data-g="buch"><h2>Besucher der Website</h2><div class="karte">'
      + '<div class="zeile">' + kachel(zahl(g.klicks7), 'Klicks · 7 Tage')
      + kachel(zahl(g.impressionen7), 'Impressionen')
      + kachel(da(g.position) ? g.position.toFixed(1).replace('.', ',') : '–', 'Ø Position')
      + '</div>'
      + (g.suchanfragen && g.suchanfragen.length
          ? '<ul class="suchliste">' + g.suchanfragen.map(function (a) {
              return '<li><span>' + h(a.wort) + '</span><b>' + zahl(a.klicks) + '</b></li>';
            }).join('') + '</ul>' : '')
      + (da(g.seitenGesamt)
          ? '<p class="hinweis">' + (da(g.seitenIndexiert) ? zahl(g.seitenIndexiert) + ' von ' : '')
            + zahl(g.seitenGesamt) + ' Seiten in der Sitemap.</p>' : '')
      + (g.gelesen ? '' : '<p class="hinweis">' + h(g.hinweis || '') + '</p>')
      + '</div></section>');

    // ---- Kanäle ----
    if (d.kanaele && d.kanaele.length) {
      var rw = d.reichweite || {};
      t.push('<section data-g="kanaele"><h2>Kanäle</h2>'
        + '<div class="karte"><div class="zeile">'
        + kachel(zahl(rw.gesamt), 'Follower gesamt')
        + kachel(da(rw.kanaeleGezaehlt) ? rw.kanaeleGezaehlt + ' / ' + rw.kanaeleGesamt : null, 'Kanäle mit Zahl')
        + '</div>' + kurveBlock('Verlauf', (d.verlauf || {}).reichweite, false) + '</div>'
        + '<div class="kanaele">'
        + d.kanaele.map(function (k) {
            var hat = da(k.follower);
            return '<div class="kanal"><b>' + h(k.name) + '</b>'
              + '<span class="griff">' + h(k.handle || '') + '</span>'
              + '<div class="zahl' + (hat ? '' : ' leer') + '">'
              + (hat ? zahl(k.follower) : 'keine Daten') + '</div>'
              + (hat ? trend(k.follower, k.vorher, false) : '')
              + kurve(((d.verlauf || {}).kanaele || {})[k.name], false)
              + '<span class="unten">' + (hat ? 'Follower' : '')
              + (da(k.reaktionen) ? (hat ? ' · ' : '') + zahl(k.reaktionen) + ' '
                  + h(k.reaktionenLabel || 'Reaktionen') : '')
              + (k.stand ? '<br>Stand ' + datum(k.stand) : '')
              + (k.notiz ? '<br>' + h(k.notiz) : '') + '</span></div>';
          }).join('') + '</div></section>');
    }

    // ---- Was sich tut ----
    if (d.aktivitaet && d.aktivitaet.length) {
      var frisch = 0;
      var zeilen = d.aktivitaet.map(function (a) {
        var neu = new Date(a.zeit).getTime() > zuletzt;
        if (neu) frisch++;
        return '<li class="' + (neu ? 'frisch' : '') + '"><span class="punkt"></span><span>'
          + '<span class="text">' + h(a.text) + '</span>'
          + '<span class="meta">' + h(a.kanal || '') + ' · ' + vorwie(a.zeit)
          + (neu ? '<span class="fahne">NEU</span>' : '') + '</span></span></li>';
      }).join('');
      t.push('<section data-g="heute"><h2>Was sich tut' + (frisch ? ' · ' + frisch + ' neu' : '')
        + '</h2><div class="karte"><ul class="lauf">' + zeilen + '</ul></div></section>');
    }

    // ---- Vorschläge ----
    if (d.vorschlaege && d.vorschlaege.length) {
      t.push('<section data-g="aufgaben"><h2>Was ich als Nächstes tun würde</h2><div class="karte">'
        + d.vorschlaege.map(function (o) {
            return '<div class="vorschlag"><b>' + h(o.titel) + '</b>'
              + (o.warum ? '<span class="warum">' + h(o.warum) + '</span>' : '')
              + (o.gewinn ? '<span class="gewinn">' + h(o.gewinn) + '</span>' : '')
              + (o.wer ? '<span class="wer">' + h(o.wer) + '</span>' : '') + '</div>';
          }).join('') + '</div></section>');
    }

    // ---- Offene Punkte ----
    if (d.offen && d.offen.length) {
      t.push('<section data-g="aufgaben"><h2>Offene Punkte</h2><div class="karte"><ul class="offen">'
        + d.offen.map(function (o) {
            return '<li><span class="stufe ' + h(o.stufe || 'klein') + '"></span><span>'
              + '<b>' + h(o.titel) + '</b>'
              + (o.warum ? '<span class="warum">' + h(o.warum) + '</span>' : '')
              + (o.wer ? '<span class="wer">' + h(o.wer) + '</span>' : '') + '</span></li>';
          }).join('') + '</ul></div></section>');
    }

    // ---- Technik ----
    var k = d.technik;
    if (k) {
      t.push('<section data-g="technik"><h2>Technik</h2><div class="karte"><div class="technik">'
        + '<span>Veröffentlichung <b>' + h(k.deploy || '—') + '</b></span>'
        + (da(k.zertifikatTage) ? '<span>Zertifikat <b>' + k.zertifikatTage + ' Tage</b></span>' : '')
        + (da(k.linksGeprueft) ? '<span>Links <b>' + k.linksGeprueft + '</b> geprüft, <b>'
            + (k.linksKaputt || 0) + '</b> kaputt</span>' : '')
        + (da(k.seitenGemeldet) ? '<span>Sitemap <b>' + k.seitenGemeldet + '</b></span>' : '')
        + (da(k.journalVorrat) ? '<span>Journal <b>' + k.journalVorrat + '</b> im Vorrat</span>' : '')
        + '</div>'
        + (k.linksZiele && k.linksZiele.length
            ? '<ul class="kaputt">' + k.linksZiele.map(function (z) {
                return '<li><b>' + z.code + '</b> <span>' + h(z.ziel) + '</span></li>';
              }).join('') + '</ul>' : '')
        + (k.stand ? '<p class="hinweis">Stand ' + vorwie(k.stand) + '.</p>' : '')
        + '</div></section>');
    }

    // ---- Wo das Dashboard blind ist ----
    if (d.luecken && d.luecken.length) {
      t.push('<section data-g="technik"><h2>Wo dieses Dashboard blind ist</h2>'
        + '<div class="karte"><ul class="luecken">'
        + d.luecken.map(function (l) {
            return '<li><b>' + h(l.was) + '</b><span class="warum">' + h(l.warum) + '</span></li>';
          }).join('') + '</ul></div></section>');
    }

    inhalt.innerHTML = '<nav class="reiter" id="reiter"></nav>' + t.join('');
    reiterBauen();
    standZeile.textContent = 'Stand ' + vorwie(d.stand);
    standZeile.className = '';
    try { localStorage.setItem(ZULETZT, String(Date.now())); } catch (e) {}
  }

  /**
   * Reiter statt einer endlosen Rolle.
   *
   * Neun Abschnitte auf einem Telefon sind drei Bildschirmlängen Daumenarbeit,
   * bevor die Zahl kommt, wegen der man das Gerät herausgeholt hat. Die Reiter
   * zeigen immer nur eine Gruppe; welche zuletzt offen war, merkt sich das
   * Gerät für sich allein.
   */
  var GRUPPEN = [
    { id: 'heute', name: 'Heute' },
    { id: 'buch', name: 'Buch' },
    { id: 'kanaele', name: 'Kanäle' },
    { id: 'aufgaben', name: 'Aufgaben' },
    { id: 'technik', name: 'Technik' }
  ];
  var OFFEN = 'trendonix-cockpit-reiter';
  var offen = 'heute';
  try { offen = localStorage.getItem(OFFEN) || 'heute'; } catch (e) {}

  function zeigen(id) {
    offen = id;
    try { localStorage.setItem(OFFEN, id); } catch (e) {}
    var s = inhalt.querySelectorAll('section[data-g]');
    for (var i = 0; i < s.length; i++) {
      s[i].hidden = s[i].getAttribute('data-g') !== id;
    }
    var kn = inhalt.querySelectorAll('.reiter button');
    for (var j = 0; j < kn.length; j++) {
      var an = kn[j].getAttribute('data-g') === id;
      kn[j].className = an ? 'an' : '';
      kn[j].setAttribute('aria-selected', an ? 'true' : 'false');
    }
    window.scrollTo(0, 0);
  }

  function reiterBauen() {
    var leiste = document.getElementById('reiter');
    if (!leiste) return;
    var da2 = {};
    var s = inhalt.querySelectorAll('section[data-g]');
    for (var i = 0; i < s.length; i++) da2[s[i].getAttribute('data-g')] = true;
    var hat = GRUPPEN.filter(function (g) { return da2[g.id]; });
    if (!hat.length) return;
    if (!da2[offen]) offen = hat[0].id;
    leiste.setAttribute('role', 'tablist');
    leiste.innerHTML = hat.map(function (g) {
      return '<button type="button" role="tab" data-g="' + g.id + '">' + g.name + '</button>';
    }).join('');
    leiste.addEventListener('click', function (e) {
      var z = e.target.closest ? e.target.closest('button[data-g]') : null;
      if (z) zeigen(z.getAttribute('data-g'));
    });
    zeigen(offen);
  }

  var laeuft = false;
  function holen() {
    if (laeuft) return;
    laeuft = true;
    knopf.setAttribute('aria-busy', 'true');
    fetch('cockpit.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (a) { if (!a.ok) throw new Error(a.status); return a.json(); })
      .then(function (d) {
        warnung.hidden = true;
        try { localStorage.setItem('trendonix-daten', JSON.stringify(d)); } catch (e) {}
        malen(d);
      })
      .catch(function () {
        var alt = null;
        try { alt = JSON.parse(localStorage.getItem('trendonix-daten') || 'null'); } catch (e) {}
        if (alt) {
          malen(alt);
          warnung.hidden = false;
          warnung.textContent = 'Kein Netz — angezeigt wird der letzte bekannte Stand von '
            + vorwie(alt.stand) + '.';
        } else {
          standZeile.textContent = 'nicht erreichbar';
          standZeile.className = 'alt';
          inhalt.innerHTML = '<section><div class="karte"><p class="hinweis">'
            + 'Keine Verbindung und noch nichts gespeichert. Einmal mit Netz öffnen, '
            + 'danach läuft es auch offline.</p></div></section>';
        }
      })
      .finally(function () { laeuft = false; knopf.removeAttribute('aria-busy'); });
  }

  knopf.addEventListener('click', holen);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) holen(); });
  setInterval(function () { if (!document.hidden) holen(); }, 60000);
  holen();

  var app = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (!app) document.getElementById('tipp').hidden = false;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
